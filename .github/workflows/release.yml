name: Build Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install nuitka zstandard

      - name: Download sing-box and wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/sing-box
          
          # Fetch sing-box 1.14.3 (Windows x64)
          $sbVersion = "1.14.3"
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v$sbVersion/sing-box-$sbVersion-windows-amd64.zip"
          Write-Host "Downloading sing-box from $sbUrl..."
          Invoke-WebRequest -Uri $sbUrl -OutFile singbox.zip
          Expand-Archive -Path singbox.zip -DestinationPath temp_sb
          Get-ChildItem -Path temp_sb -Filter "sing-box.exe" -Recurse | Move-Item -Destination "bin/sing-box/sing-box.exe"
          
          # Fetch wintun.dll (for TUN mode on Windows)
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Write-Host "Downloading wintun driver..."
          Invoke-WebRequest -Uri $wintunUrl -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath temp_wintun
          Copy-Item "temp_wintun/wintun/bin/amd64/wintun.dll" "bin/sing-box/wintun.dll"

      - name: Compile with Nuitka (Native C++)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --output-dir=dist `
            --output-filename=Socksicle.exe `
            --include-data-dir=assets=assets `
            --include-data-files=icon.svg=icon.svg `
            --include-data-files=icon.ico=icon.ico `
            --include-data-files=pyproject.toml=pyproject.toml `
            --include-data-dir=bin=bin `
            main.py

          if (Test-Path "dist/main.dist") {
            Move-Item -Path "dist/main.dist" -Destination "dist/Socksicle.dist" -Force
          }

      - name: Resolve Version
        id: get_version
        shell: pwsh
        run: |
          $ver = ""
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $match = Select-String -Path "pyproject.toml" -Pattern 'version\s*=\s*"([^"]+)"'
            if ($match) {
              $ver = $match.Matches.Groups[1].Value
            } else {
              $ver = "0.1-rc.1"
            }
          }
          Write-Host "Resolved application version: $ver"
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Socksicle.dist/* -DestinationPath "Socksicle-$env:VERSION-Windows-Portable-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            /DMyAppVersion="$env:VERSION" `
            /DOutputBaseFilename="Socksicle-Setup-$env:VERSION-x64" `
            packaging/windows/installer.iss

      - name: Upload Artifacts to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: socksicle-windows-artifacts
          path: |
            dist-installer/*.exe
            *.zip

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 \
            libfontconfig1 libfreetype6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install nuitka zstandard

      - name: Download sing-box (Linux amd64)
        run: |
          mkdir -p bin/sing-box
          sbVersion="1.14.3"
          sbUrl="https://github.com/SagerNet/sing-box/releases/download/v${sbVersion}/sing-box-${sbVersion}-linux-amd64.tar.gz"
          echo "Downloading sing-box from $sbUrl..."
          curl -sSL "$sbUrl" | tar -xz -C bin/sing-box --strip-components=1
          chmod +x bin/sing-box/sing-box

      - name: Resolve Version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
            [ -z "$VER" ] && VER="0.1-rc.1"
          fi
          echo "Resolved version: $VER"
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Compile with Nuitka (Native C++)
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            --output-filename=socksicle \
            --include-data-dir=assets=assets \
            --include-data-files=icon.svg=icon.svg \
            --include-data-files=pyproject.toml=pyproject.toml \
            --include-data-dir=bin=bin \
            main.py

          if [ -d "dist/main.dist" ]; then
            mv dist/main.dist dist/Socksicle.dist
          fi

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          
          # Copy standalone build
          cp -r dist/Socksicle.dist/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/socksicle
          chmod +x AppDir/usr/bin/bin/sing-box/sing-box 2>/dev/null || true

          # Create AppRun entrypoint
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/socksicle" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create desktop shortcut
          cat << 'EOF' > AppDir/socksicle.desktop
          [Desktop Entry]
          Name=Socksicle
          Exec=socksicle
          Icon=socksicle
          Type=Application
          Categories=Network;Proxy;
          Comment=Cross-platform proxy client with Material 3 UI
          Terminal=false
          EOF
          cp AppDir/socksicle.desktop AppDir/usr/share/applications/socksicle.desktop

          # Copy icon
          cp icon.svg AppDir/socksicle.svg
          cp icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/socksicle.svg

          # Download and run appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "Socksicle-${VERSION}-x86_64.AppImage"

      - name: Upload Artifacts to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: socksicle-linux-artifacts
          path: "*.AppImage"

  publish-release:
    name: Publish Release Artifacts
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.zip
            *.AppImage
