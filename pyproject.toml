[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socksicle"
version = "0.1-rc.1"
description = "Multi-protocol proxy client with a clean Material Design GUI supporting Shadowsocks, VLESS, VMess, and Hysteria 2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "iwtsd"},
]
keywords = ["shadowsocks", "proxy", "gui", "vless", "vmess", "hysteria2", "hy2", "socks5", "xray", "sing-box"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: Proxy Servers",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "cryptography>=42.0",
    "PySide6>=6.0.0",
    "PySocks>=1.7.1",
    "qrcode[pil]>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/socksicle/desktop"
Repository = "https://github.com/socksicle/desktop"
Issues = "https://github.com/socksicle/desktop/issues"

[project.gui-scripts]
socksicle = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["ui", "utils"]
include = [
    "main.py",
    "icon.svg",
    "assets",
]

[tool.hatch.build]
artifacts = [
    "icon.svg",
]
